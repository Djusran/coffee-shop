<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Website 96° Coffee Shop" />
  <title>96° Coffee Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#beranda">96° COFFEE SHOP</a>
    <nav aria-label="Navigasi utama">
      <a href="#beranda">Beranda</a>
      <a href="#cerita">Cerita</a>
      <a href="#galeri">Galeri</a>
      <a href="#kontak">Kontak</a>
    </nav>
  </header>

  <main>
    <!-- Setiap gambar SVG dari file ZIP digabung menjadi satu alur website -->
    <section id="beranda" class="visual-section hero">
      <img src="assets/1.svg" alt="96° Coffee Shop - Menciptakan suasana yang menyenangkan" />
    </section>

    <section id="cerita" class="visual-section story">
      <img src="assets/2.svg" alt="Cerita dan suasana 96° Coffee Shop" />
    </section>

    <section id="galeri" class="visual-section gallery">
      <img src="assets/3.svg" alt="Testimoni, Instagram, dan jepretan pelanggan 96° Coffee Shop" />
    </section>

    <section id="kontak" class="visual-section contact">
      <img src="assets/4.svg" alt="Hubungi 96° Coffee Shop" />
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> 96° Coffee Shop</p>
    <a href="#beranda">Kembali ke atas ↑</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
